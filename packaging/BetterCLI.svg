<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#26364D"/><stop offset="1" stop-color="#071322"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E5F0FF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08D8E8"/><stop offset="1" stop-color="#075CFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#193A66" flood-opacity="0.27"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tile-clip"><rect x="64" y="58" width="896" height="896" rx="218"/></clipPath>
  </defs>
  <rect x="64" y="58" width="896" height="896" rx="218" fill="url(#tile)" stroke="#D6E5FA" stroke-width="3" filter="url(#shadow)"/>
