    <path d="m216 400 78 57-78 57" fill="none" stroke="#FFFFFF" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <rect x="307" y="493" width="108" height="28" rx="10" fill="url(#blue)" filter="url(#glow)"/>
    <path d="M511 150h336a47 47 0 0 1 47 47v310a47 47 0 0 1-47 47H516a47 47 0 0 1-47-47v-91l-42-31 42-31V197a47 47 0 0 1 47-47z" fill="url(#panel)" stroke="#8DC8FF" stroke-width="5" filter="url(#shadow)"/>
