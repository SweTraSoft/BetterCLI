    <rect x="110" y="210" width="710" height="410" rx="58" fill="url(#terminal)" stroke="#7597C8" stroke-width="8" filter="url(#shadow)"/>
    <path d="M116 278v-10a50 50 0 0 1 50-50h598a50 50 0 0 1 50 50v10z" fill="#FFFFFF" fill-opacity=".12"/>
