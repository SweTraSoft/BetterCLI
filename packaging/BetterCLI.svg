    <circle cx="529" cy="226" r="17" fill="none" stroke="#344E70" stroke-width="6"/><path d="m542 239 17 17" stroke="#344E70" stroke-width="6" stroke-linecap="round"/>
    <text x="584" y="239" fill="#20334F" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="35">git commit</text>
    <rect x="491" y="282" width="378" height="72" rx="22" fill="url(#blue)"/>
    <text x="512" y="328" fill="#FFFFFF" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="29" font-weight="700">-m</text><text x="650" y="328" fill="#FFFFFF" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="25">Commit message</text>
    <text x="512" y="396" fill="#20334F" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="27" font-weight="600">-a</text><text x="650" y="396" fill="#405D83" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="24">Stage and commit all</text>
    <text x="512" y="456" fill="#20334F" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="27" font-weight="600">--amend</text><text x="650" y="456" fill="#405D83" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="24">Amend last commit</text>
