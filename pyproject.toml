[project]
name = "bettercli"
version = "0.1.0"
description = "Turn any CLI command into an on-the-fly graphical form."
readme = "README.md"
authors = [
    { name = "wolfhongkong", email = "99960268+wolfhongkong@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "openai>=1.40",
    "keyring>=25.0",
]

[project.scripts]
bettercli = "cligui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cligui"

[tool.pytest.ini_options]
testpaths = ["tests"]
